<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Memories">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ac8ff"/>
      <stop offset="100%" stop-color="#0079c4"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- A stack of photos: two tilted cards behind the front one. -->
  <g transform="rotate(-14 32 34)">
    <rect x="15" y="20" width="34" height="27" rx="3.5" fill="#ffffff" opacity="0.45"/>
  </g>
  <g transform="rotate(-6 32 34)">
    <rect x="15" y="21" width="34" height="27" rx="3.5" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Front photo, with a simple landscape so it still reads at 16px. -->
  <rect x="15" y="22" width="34" height="27" rx="3.5" fill="#ffffff"/>
  <circle cx="25" cy="31" r="3.4" fill="#ffc53d"/>
  <path d="M15 43.5l8.5-8 6 5.2 6.5-5.4 13 12v1.2a2.5 2.5 0 0 1-2.5 2.5h-29A2.5 2.5 0 0 1 15 48z" fill="#0091d8"/>
</svg>
